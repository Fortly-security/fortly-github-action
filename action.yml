name: "Fortly Security Scan"
description: "Automated DAST + IaC security scanning for web applications. Scans your app for OWASP Top 10, API security, and infrastructure misconfigurations."
author: "Fortly"
branding:
  icon: "shield"
  color: "red"

inputs:
  api-key:
    description: "Fortly API key (get one at https://fortly.io/settings/api-keys). Optional for basic scanning."
    required: false
  target-url:
    description: "URL to scan for DAST (e.g., https://staging.myapp.com). Required only for DAST scanning."
    required: false
  fail-threshold:
    description: "Minimum security score to pass (0-100). PR check fails if score is below this."
    required: false
    default: "60"
  scan-iac:
    description: "Enable IaC scanning for Terraform, Docker, K8s files changed in the PR"
    required: false
    default: "true"
  scan-mode:
    description: "Scan mode: quick (30s, top vulns) or full (5min, all modules)"
    required: false
    default: "quick"
  comment-on-pr:
    description: "Post scan results as a PR comment"
    required: false
    default: "true"
  api-url:
    description: "Fortly API base URL (for self-hosted instances)"
    required: false
    default: "https://api.fortly.io"
  upload-sarif:
    description: "Upload SARIF results to GitHub Security tab (requires security-events: write permission)"
    required: false
    default: "true"
  scan-secrets:
    description: "Scan PR files for leaked secrets (API keys, tokens, passwords)"
    required: false
    default: "true"
  auto-remediate:
    description: "Automatically create fix PRs for vulnerabilities found (requires repo write access)"
    required: false
    default: "false"
  remediate-severity:
    description: "Minimum severity to auto-remediate (critical, high, medium)"
    required: false
    default: "high"
  scan-deps:
    description: "Scan dependencies for known vulnerabilities via OSV.dev"
    required: false
    default: "true"
  scan-sast:
    description: "Run static code analysis on PR files (JavaScript, Python, Java, Go)"
    required: false
    default: "true"

outputs:
  score:
    description: "Security score (0-100)"
  grade:
    description: "Security grade (A+ to F)"
  vulnerabilities:
    description: "Total vulnerabilities found"
  critical-count:
    description: "Number of critical vulnerabilities"
  high-count:
    description: "Number of high vulnerabilities"
  scan-url:
    description: "URL to the full scan report"
  passed:
    description: "Whether the scan passed the threshold (true/false)"
  sarif-file:
    description: "Path to the generated SARIF file"
  secrets-found:
    description: "Number of secrets found in PR files"
  remediation-pr:
    description: "URL of the auto-remediation PR (if created)"
  fixes-count:
    description: "Number of vulnerabilities auto-fixed"
  dependencies-total:
    description: "Total number of dependencies found"
  dependencies-vulnerable:
    description: "Number of vulnerable dependencies"
  sast-findings:
    description: "Number of SAST findings in code"

runs:
  using: "node20"
  main: "dist/index.js"
